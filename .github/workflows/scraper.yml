name: Product Scraper

on:
  schedule:
    # Martes y viernes a las 8:00 AM (hora España)
    - cron: '0 6 * * 2,5'
  workflow_dispatch: # permite ejecutar manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > backend/credentials.json

      - name: Run scraper
        run: cd backend && python scraper.py

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add products_data.json data/products.json assets/images/products/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-scrape: update products $(date +%Y-%m-%d)"
            git push
          fi
